# Builds the frozen quack.exe and attaches it to a GitHub Release.
#
# Without this, the only quack.exe in existence lives on one developer's
# machine: dist/ is gitignored, so a fresh clone has no binary and the VS
# extension cannot be built by anyone else.
name: release

on:
  push:
  # Manual trigger for testing the build without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # quack.spec stamps the build with `git rev-parse --short HEAD`.
          # A shallow clone still resolves HEAD, but fetch the tag history so
          # the stamp is meaningful and `git status` is genuinely clean.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"
          pip install pyinstaller

      - name: Test
        run: python -m pytest -q

      - name: Build VS Code extension (CI check)
        working-directory: clients/vscode
        run: |
          npm ci
          npx tsc --noEmit -p ./

      - name: Build
        run: python -m PyInstaller quack.spec --clean --noconfirm

      - name: Verify the stamp
        # A build that reports "(source)" means the spec did not stamp it,
        # which is the exact failure this whole mechanism exists to catch.
        run: |
          $out = & .\dist\quack.exe --version
          Write-Host $out
          if ($out -match "source") {
            Write-Error "exe reports (source): build stamp did not apply"
            exit 1
          }
        shell: pwsh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the VS Code extension
        # The exe is only half the tool: without the vsix, a user who
        # downloads the release has a CLI and no way to drive it from the
        # editor. npm ci (not install) so a drifted lockfile fails here
        # rather than being silently rewritten mid-release.
        working-directory: clients/vscode
        run: |
          npm ci
          npx vsce package --allow-missing-repository

      - name: Verify the extension version matches the tag
        # Both halves ship under one release, so they must not disagree about
        # what version they are. Skipped on workflow_dispatch, where there is
        # no tag to match against.
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: clients/vscode
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "tag=$tag package.json=$pkg"
          if ($tag -ne $pkg) {
            Write-Error "tag $tag does not match extension version $pkg"
            exit 1
          }
          if (-not (Test-Path "quack-abb-$pkg.vsix")) {
            Write-Error "expected quack-abb-$pkg.vsix was not produced"
            exit 1
          }
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: quack-exe
          path: dist/quack.exe

      - uses: actions/upload-artifact@v4
        with:
          name: quack-vsix
          path: clients/vscode/*.vsix

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/quack.exe
            clients/vscode/*.vsix
          generate_release_notes: true
