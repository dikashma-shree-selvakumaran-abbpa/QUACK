[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quack"
version = "0.2.1"
description = "An AI-assisted pre-commit quality hook."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "quack maintainers" }]
dependencies = [
	"click>=8.1",
	"pyyaml>=6.0",
	"httpx>=0.27",
	"rich>=13.0",
	"github-copilot-sdk>=1.0.8",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.0",
]

[project.scripts]
quack = "quack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
