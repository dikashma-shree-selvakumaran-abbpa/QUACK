# See https://pre-commit.com/#creating-new-hooks
- id: quack
  name: quack
  description: AI-assisted pre-commit quality hook.
  entry: quack check
  language: python
  pass_filenames: false
  stages: [pre-commit]

- id: quack-agent
  name: quack-agent
  description: AI review (and agent) pre-push hook.
  entry: quack agent
  language: python
  pass_filenames: false
  stages: [pre-push]
  verbose: true
